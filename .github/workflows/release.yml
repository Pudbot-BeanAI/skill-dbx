name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-tag-from-main:
    name: Verify tag commit is on main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch origin/main
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Validate tagged commit ancestry
        shell: bash
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "Tag ${GITHUB_REF_NAME} points to a commit contained in origin/main."
          else
            echo "::error::Tag ${GITHUB_REF_NAME} does not point to a commit contained in origin/main. Release packaging is limited to tags on main history."
            exit 1
          fi

  build-skill:
    name: Build skill (${{ matrix.platform }}-${{ matrix.arch }})
    needs: verify-tag-from-main
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: amd64
            binary_name: dbx
          - os: macos-latest
            platform: macos
            arch: amd64
            binary_name: dbx
          - os: windows-latest
            platform: windows
            arch: amd64
            binary_name: dbx.exe

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build release binary
        run: cargo build --locked --release --bin dbx

      - name: Package skill artifact
        shell: bash
        run: |
          python scripts/package_skill.py \
            --binary target/release/${{ matrix.binary_name }} \
            --target-os ${{ matrix.platform }} \
            --target-arch ${{ matrix.arch }} \
            --output-dir dist

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: skill-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/dbx-dba-${{ matrix.platform }}-${{ matrix.arch }}.skill
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    needs: build-skill
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: skill-*
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.skill
          generate_release_notes: true
          fail_on_unmatched_files: true
