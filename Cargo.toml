[package]
name = "dbx"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
comfy-table = "7.1"
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "any", "mysql", "postgres", "sqlite", "json"] }
tokio = { version = "1.43", features = ["fs", "macros", "rt-multi-thread"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3.14"
